<!-- home hero section -->
<div class="jumbotron neon-hero">
  <div class="hero-glow hero-glow-left"></div>
  <div class="hero-glow hero-glow-right"></div>
  <img class="author-profile-img hero-avatar" src="{{site.url}}{{site.baseurl}}/assets/img/{{site.author_logo}}" />
  <p class="jumbotron-heading">Hi, I am {{site.author}} !</p>
  <p class="hero-kicker">Portfolio · pages · experiments</p>
  <p class="lead" id="typewriteText"></p>
  <span>
    {%- include github_star_button.html -%}
    {%- include github_fork_button.html -%}
  </span>
  <div class="jumbotron-btns">
    <a href="{{site.url}}{{site.baseurl}}/about/">
      <button class="btn btn-md btn-warning"> <strong>About</strong> </button>
    </a>
    <a href="{{site.url}}{{site.baseurl}}/blog/">
      <button class="btn btn-md btn-default"> <strong>Blog</strong> </button>
    </a>
  </div>
</div>
